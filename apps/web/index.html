<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app-icon.png" />
    <!-- iOS Safari 스마트 앱 배너 — 미설치 사용자를 App Store(포메 id6797220287)로 유도한다.
         네이티브 웹뷰(WKWebView)에는 표시되지 않으므로 앱 안 화면에는 영향이 없다. -->
    <meta name="apple-itunes-app" content="app-id=6797220287" />
    <!--
    `user-scalable=no, maximum-scale=1` — 세션 화면에서 **핀치 줌을 막는다**.

    카메라 프리뷰를 두 손가락으로 벌리면 페이지 전체가 확대돼 타이머·컨트롤 바가 화면 밖으로
    밀려난다. 세션 중에 컨트롤 바를 잃으면 종료·일시정지 경로가 사라지므로 단순한 미관 문제가
    아니다. 프리뷰는 어차피 CSS `object-fit`이 배치를 정하므로 핀치 줌으로 얻을 것도 없다.

    ⚠️ 접근성 상충: WCAG 1.4.4는 200% 확대를 요구하고, 이 설정은 그걸 막는다. 세션 화면은
    본문 텍스트를 읽는 화면이 아니라 카메라 뷰파인더 + 큰 타이머라 확대 필요가 낮다고 보고
    막았다(2026-07-30). `apps/web`을 일반 브라우저 서비스로 넓힐 때는 재검토할 것 —
    이 meta는 앱 전용이 아니라 **문서 전체**에 걸린다.
  -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>FocusMakers</title>
    <!--
      초대 링크 공유용 OG 태그(카카오톡 등 리치 프리뷰). SPA라 라우트별 분기 없이 사이트
      공통으로 건다 — 룸별 동적 썸네일이 필요해지면 그때 서버 렌더링/엣지 함수로 옮긴다.
      og:image는 크롤러가 절대 URL만 읽으므로 배포 도메인으로 고정한다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://web.sunqstudio.kr/" />
    <meta property="og:site_name" content="포커스 메이커스" />
    <meta property="og:title" content="포커스 메이커스" />
    <meta
      property="og:description"
      content="그룹 스터디에 초대받았어요! 초대코드로 참여해 함께 공부해요"
    />
    <meta property="og:image" content="https://web.sunqstudio.kr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="포커스 메이커스 그룹 스터디 초대" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
