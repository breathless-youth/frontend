<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>포메 Vision 벤치</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
    />
    <style>
      /* 레이아웃: 계측 콘솔 — 상단에 빌드 로직 판, 좌측 입력·설정 / 우측 실행, 아래로 결과가 쌓인다 */
      :root {
        --bg: #f3f5f7;
        --panel: #ffffff;
        --ink: #16202b;
        --muted: #5b6876;
        --line: #d9dfe6;
        --soft: #eaeef2;
        --accent: #2457d6;
        --accent-ink: #ffffff;
        --c-focus: #1f8a62;
        --c-away: #5d6b7c;
        --c-phone: #d4861a;
        --c-sleep: #7656cf;
        --c-none: #c9d0d8;
        --bad: #c2412f;
        --good: #1f8a62;
        --sans:
          "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f141a;
          --panel: #161d25;
          --ink: #e3e9ef;
          --muted: #93a1b0;
          --line: #27313c;
          --soft: #1d2630;
          --accent: #7aa2ff;
          --accent-ink: #0b1220;
          --c-focus: #3fbf8c;
          --c-away: #8c9bad;
          --c-phone: #f0a63c;
          --c-sleep: #a28af0;
          --c-none: #3a4552;
          --bad: #ef7b67;
          --good: #3fbf8c;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f141a;
        --panel: #161d25;
        --ink: #e3e9ef;
        --muted: #93a1b0;
        --line: #27313c;
        --soft: #1d2630;
        --accent: #7aa2ff;
        --accent-ink: #0b1220;
        --c-focus: #3fbf8c;
        --c-away: #8c9bad;
        --c-phone: #f0a63c;
        --c-sleep: #a28af0;
        --c-none: #3a4552;
        --bad: #ef7b67;
        --good: #3fbf8c;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.55 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 84rem;
        margin: 0 auto;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 1.6rem 4rem;
        display: grid;
        gap: 1.25rem;
      }
      h1 {
        font-size: 1.45rem;
        line-height: 1.2;
        margin: 0;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      h2 {
        font-size: 1rem;
        margin: 0;
        font-weight: 600;
        text-wrap: balance;
      }
      h3 {
        font-size: 0.9rem;
        margin: 0;
        font-weight: 600;
      }
      p {
        margin: 0;
      }
      .muted {
        color: var(--muted);
      }
      .mono,
      code,
      .num {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      code {
        font-size: 0.85em;
        background: var(--soft);
        padding: 0.05em 0.35em;
        border-radius: 3px;
      }
      .eyebrow {
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      header.top {
        display: grid;
        gap: 0.6rem;
      }
      .lede {
        color: var(--muted);
        max-width: 62ch;
      }
      .consts {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 0.45rem;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 999px;
        padding: 0.12rem 0.6rem;
        font-size: 0.76rem;
        font-family: var(--mono);
        white-space: nowrap;
      }
      .chip b {
        font-weight: 500;
        color: var(--muted);
      }
      .chip.changed {
        border-color: var(--accent);
        color: var(--accent);
      }
      .grid2 {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
        gap: 1.25rem;
        align-items: start;
      }
      @media (max-width: 880px) {
        .grid2 {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1rem 1.1rem;
        display: grid;
        gap: 0.85rem;
        min-width: 0;
      }
      .panel-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .drop {
        border: 1.5px dashed var(--line);
        border-radius: 8px;
        padding: 1.1rem;
        display: grid;
        gap: 0.4rem;
        place-items: center;
        text-align: center;
        cursor: pointer;
        background: var(--bg);
      }
      .drop:hover,
      .drop.over {
        border-color: var(--accent);
      }
      .drop:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .drop strong {
        font-weight: 600;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      button,
      .btn {
        font: inherit;
        font-size: 0.85rem;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 6px;
        padding: 0.38rem 0.8rem;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--muted);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.link {
        border: 0;
        background: none;
        padding: 0;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      input,
      select,
      textarea {
        font: inherit;
        font-size: 0.85rem;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 0.28rem 0.45rem;
      }
      input[type="number"] {
        width: 6.2rem;
        font-family: var(--mono);
      }
      textarea {
        width: 100%;
        min-height: 7rem;
        font-family: var(--mono);
        font-size: 0.78rem;
        resize: vertical;
      }
      label {
        display: inline-flex;
        gap: 0.4rem;
        align-items: center;
      }
      .scroll {
        overflow-x: auto;
        min-width: 0;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.82rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.4rem 0.55rem;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      th {
        font-size: 0.7rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
        white-space: nowrap;
      }
      td.num,
      th.num {
        text-align: right;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      .settings {
        display: grid;
        gap: 0.9rem;
      }
      .field {
        display: grid;
        grid-template-columns: 9.5rem minmax(0, 1fr);
        gap: 0.6rem;
        align-items: center;
      }
      @media (max-width: 520px) {
        .field {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .field > span {
        color: var(--muted);
        font-size: 0.82rem;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      .seg label {
        padding: 0.3rem 0.7rem;
        cursor: pointer;
        font-size: 0.82rem;
        border-right: 1px solid var(--line);
      }
      .seg label:last-child {
        border-right: 0;
      }
      .seg input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .seg label:has(input:checked) {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .seg label:has(input:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .hint {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .pill {
        display: inline-block;
        font-family: var(--mono);
        font-size: 0.72rem;
        padding: 0.08rem 0.45rem;
        border-radius: 4px;
        color: #fff;
        white-space: nowrap;
      }
      .pill.FOCUS {
        background: var(--c-focus);
      }
      .pill.AWAY {
        background: var(--c-away);
      }
      .pill.PHONE {
        background: var(--c-phone);
      }
      .pill.SLEEP {
        background: var(--c-sleep);
      }
      .pill.none {
        background: var(--c-none);
        color: var(--ink);
      }
      .run {
        display: grid;
        gap: 0.75rem;
      }
      .preview {
        position: relative;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        aspect-ratio: 16/9;
        max-width: 100%;
        display: grid;
        place-items: center;
      }
      .preview video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .preview .empty {
        color: #9aa7b4;
        font-size: 0.85rem;
        padding: 1rem;
        text-align: center;
      }
      .live {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        align-items: center;
      }
      .light {
        font-family: var(--mono);
        font-size: 0.72rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0.05rem 0.4rem;
        color: var(--muted);
      }
      .light.on {
        border-color: var(--bad);
        color: var(--bad);
        font-weight: 500;
      }
      .bar {
        height: 6px;
        background: var(--soft);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: var(--accent);
        width: 0;
        transition: width 0.2s;
      }
      @media (prefers-reduced-motion: reduce) {
        .bar > i {
          transition: none;
        }
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
        gap: 0.6rem;
      }
      .kpi {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.6rem 0.75rem;
        display: grid;
        gap: 0.15rem;
        background: var(--bg);
      }
      .kpi .v {
        font-family: var(--mono);
        font-size: 1.25rem;
        font-variant-numeric: tabular-nums;
      }
      .kpi .k {
        font-size: 0.74rem;
        color: var(--muted);
      }
      .kpi .s {
        font-size: 0.72rem;
        color: var(--muted);
        font-family: var(--mono);
      }
      .bad {
        color: var(--bad);
      }
      .good {
        color: var(--good);
      }
      .clip {
        border-top: 1px solid var(--line);
        padding-top: 1rem;
        display: grid;
        gap: 0.75rem;
      }
      .clip:first-of-type {
        border-top: 0;
        padding-top: 0;
      }
      .clip-head {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 1rem;
        align-items: baseline;
      }
      .tl {
        min-width: 720px;
        width: 100%;
        height: auto;
        display: block;
        cursor: crosshair;
      }
      .tl text {
        fill: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
      }
      .review {
        display: grid;
        grid-template-columns: minmax(0, 18rem) minmax(0, 1fr);
        gap: 1rem;
        align-items: start;
      }
      @media (max-width: 760px) {
        .review {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .review video {
        width: 100%;
        border-radius: 6px;
        background: #000;
        max-width: 100%;
      }
      details > summary {
        cursor: pointer;
        color: var(--accent);
        font-size: 0.85rem;
      }
      details[open] > summary {
        margin-bottom: 0.6rem;
      }
      .cm td.num {
        position: relative;
      }
      .warn {
        border-left: 3px solid var(--c-phone);
        padding: 0.35rem 0.7rem;
        background: var(--bg);
        font-size: 0.82rem;
      }
      .err {
        border-left: 3px solid var(--bad);
        padding: 0.35rem 0.7rem;
        background: var(--bg);
        font-size: 0.82rem;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 0.9rem;
        font-size: 0.76rem;
        color: var(--muted);
      }
      .legend i {
        display: inline-block;
        width: 0.75rem;
        height: 0.75rem;
        border-radius: 2px;
        margin-right: 0.3rem;
        vertical-align: -1px;
      }
      .empty-state {
        display: grid;
        gap: 0.5rem;
        padding: 1rem;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
      }
      .clips-table td:first-child {
        max-width: 16rem;
        overflow-wrap: anywhere;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 0.45rem 0.9rem;
        border-radius: 6px;
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
