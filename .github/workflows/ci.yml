name: CI

on:
  pull_request:
    # edited: PR 제목 수정 시에도 pr-title 검사를 재실행하기 위함
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  # edited(제목/본문 편집) 실행은 quality를 스킵하는데, 같은 그룹이면 실행 중인 무거운
  # 실행을 취소해 quality가 끝나지 못한다. edited만 별도 레인으로 분리해 서로 취소하지 않게 한다.
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'edited' || 'build' }}
  cancel-in-progress: true

jobs:
  # PR 제목 컨벤션: "[타입] SCRUM-N 제목" (티켓 없는 작업은 "[타입] 제목")
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title convention
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # 두 번째 grep: 티켓 자리에 GitHub 이슈번호(#171)를 쓰는 위반 차단 (Jira 키는 BY-N만 허용)
          # 세 번째 grep: 티켓 번호만 있고 제목 텍스트가 없는 케이스("[feat] BY-147") 차단
          if echo "$TITLE" | grep -qE '^\[(feat|fix|docs|style|refactor|test|chore|design|comment|rename|remove|release|!HOTFIX)\] (BY-[0-9]+ )?[^ ]' \
            && ! echo "$TITLE" | grep -qE '^\[[^]]+\] #[0-9]+' \
            && ! echo "$TITLE" | grep -qE '^\[[^]]+\] BY-[0-9]+ *$'; then
            echo "OK: $TITLE"
          else
            echo "PR 제목이 컨벤션을 위반합니다: '$TITLE'"
            echo "형식: [타입] BY-N 제목 (티켓 없는 작업은 [타입] 제목)"
            echo "타입: feat fix docs style refactor test chore design comment rename remove release !HOTFIX"
            exit 1
          fi

  quality:
    # edited(제목/본문 수정)는 pr-title만 재검사하면 되므로 무거운 빌드는 건너뛴다 (push 트리거는 보존)
    if: github.event_name == 'push' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json의 packageManager 필드가 단일 소스다 (여기에 version을 쓰면 충돌)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Test scripts
        run: pnpm test:scripts

      - name: Format check
        run: pnpm format:check

      - name: Build web
        run: pnpm --filter web build

      - name: Expo export (mobile static analysis build)
        run: pnpm --filter mobile exec expo export --platform android

  # 릴리즈 PR(base main)의 버전 검사: 웹은 올라야 하고 앱은 내려가지만 않으면 된다
  version-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Fetch base
        run: git fetch --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}
      - name: Check versions
        run: node scripts/check-version.mjs --base "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}

  # 릴리즈 PR(base main)을 머지하기 전에 web/<버전> Release에 노트가 있는지 본다.
  # 운영 배포 알림과 Amplitude Release는 배포가 끝날 때 노트를 한 번만 읽기 때문이다.
  # Draft는 쓰기 권한이 있어야 보여서, PR 코드를 실행하지 않도록 체크아웃 없이 API만 부른다.
  # 노트를 쓴 뒤에는 PR 제목·본문을 고치거나 이 job을 다시 실행한다.
  release-notes:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check release notes
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/apps/web/package.json?ref=$HEAD_SHA" --jq .content | base64 -d | jq -r .version)
          body=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq ".[] | select(.tag_name == \"web/$version\") | .body")
          if [ -z "${body//[[:space:]]/}" ]; then
            echo "::error::web/$version Release(Draft 포함)에 릴리즈 노트가 없습니다. 노트를 쓴 뒤 PR 제목·본문을 고치거나 이 job을 다시 실행하세요."
            exit 1
          fi
          echo "web/$version 릴리즈 노트 확인"
