name: CI

on:
  pull_request:
    # edited: PR 제목 수정 시에도 pr-title 검사를 재실행하기 위함
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR 제목 컨벤션: "[타입] SCRUM-N 제목" (티켓 없는 작업은 "[타입] 제목")
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title convention
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # 두 번째 grep: 티켓 자리에 GitHub 이슈번호(#171)를 쓰는 위반 차단 (Jira 키는 SCRUM-N만 허용)
          # 세 번째 grep: 티켓 번호만 있고 제목 텍스트가 없는 케이스("[feat] SCRUM-147") 차단
          if echo "$TITLE" | grep -qE '^\[(feat|fix|docs|style|refactor|test|chore|design|comment|rename|remove|!HOTFIX)\] (SCRUM-[0-9]+ )?[^ ]' \
            && ! echo "$TITLE" | grep -qE '^\[[^]]+\] #[0-9]+' \
            && ! echo "$TITLE" | grep -qE '^\[[^]]+\] SCRUM-[0-9]+ *$'; then
            echo "OK: $TITLE"
          else
            echo "PR 제목이 컨벤션을 위반합니다: '$TITLE'"
            echo "형식: [타입] SCRUM-N 제목 (티켓 없는 작업은 [타입] 제목)"
            echo "타입: feat fix docs style refactor test chore design comment rename remove !HOTFIX"
            exit 1
          fi

  quality:
    # edited(제목/본문 수정)는 pr-title만 재검사하면 되므로 무거운 빌드는 건너뛴다 (push 트리거는 보존)
    if: github.event_name == 'push' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json의 packageManager 필드가 단일 소스다 (여기에 version을 쓰면 충돌)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Format check
        run: pnpm format:check

      - name: Build web
        run: pnpm --filter web build

      # `assets/web-dist`는 .gitignore 대상(빌드 산출물)이라 체크아웃 직후에는 **없다.**
      # 그래서 복사를 빼고 `sync-web:check`만 돌리면 항상 "전부 누락"으로 실패한다 —
      # 실제로 그렇게 바뀐 뒤 이 job이 어떤 PR에서도 통과하지 못했다.
      #
      # 복사가 검증보다 먼저 와야 하는 이유는 두 가지다.
      #   1. 아래 `expo export`가 web-dist를 실제로 요구한다 — 없으면 prebuild가 멈춘다
      #      (`plugins/withWebDistAssets.js`의 의도된 동작).
      #   2. 커밋되지 않는 산출물이라 CI에서 "복사를 깜빡했는지"는 애초에 판별할 수 없다.
      # 즉 여기서의 `:check`는 로컬 작업자용 가드이고, CI에서는 복사 자체가 목적이다.
      - name: Sync web-dist
        run: pnpm --filter mobile sync-web && pnpm --filter mobile sync-web:check

      - name: Expo export (mobile static analysis build)
        run: pnpm --filter mobile exec expo export --platform android
